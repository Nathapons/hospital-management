<div class="space-y-6">
  <div class="bg-white rounded-lg border border-gray-200 p-8 shadow-sm">
    <h3 class="text-lg font-bold text-gray-900 mb-1">Create New User</h3>
    <p class="text-sm text-gray-500 mb-6">Enter user details to create a new account in CareConnect.</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
      <!-- First Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
        <input type="text" placeholder="e.g. John" class="w-full px-3 py-2 bg-[#f8f9fa] border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-[#7ca081] transition-colors text-sm">
      </div>
      <!-- Last Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
        <input type="text" placeholder="e.g. Doe" class="w-full px-3 py-2 bg-[#f8f9fa] border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-[#7ca081] transition-colors text-sm">
      </div>
      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" placeholder="johndoe123" class="w-full px-3 py-2 bg-[#f8f9fa] border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-[#7ca081] transition-colors text-sm">
      </div>
      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" placeholder="••••••••" class="w-full px-3 py-2 bg-[#f8f9fa] border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-[#7ca081] transition-colors text-sm">
      </div>
      <!-- Date of Birth -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
        <div class="relative">
          <input type="date" class="w-full px-3 py-2 bg-[#f8f9fa] border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-[#7ca081] transition-colors text-sm text-gray-500">
        </div>
      </div>
      <!-- Department -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
        <select class="w-full px-3 py-2 bg-[#f8f9fa] border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-[#7ca081] transition-colors text-sm text-gray-500 appearance-none">
          <option>Select department</option>
          <option>Cardiology</option>
          <option>Neurology</option>
          <option>Pediatrics</option>
          <option>Orthopedics</option>
          <option>General Practice</option>
          <option>Emergency Room</option>
        </select>
      </div>
      <!-- Address -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
        <textarea rows="3" placeholder="Full Address" class="w-full px-3 py-2 bg-[#f8f9fa] border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-[#7ca081] transition-colors text-sm resize-none"></textarea>
      </div>
    </div>
  </div>

  <div class="flex justify-end pt-2 pb-6">
    <button class="bg-[#87b48c] hover:bg-[#7ca081] text-white font-medium py-2 px-6 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#7ca081] text-sm shadow-sm">
      Create User
    </button>
  </div>
</div>
